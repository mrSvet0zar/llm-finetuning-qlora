name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Annule les executions precedentes encore en cours sur la meme branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Volontairement SANS torch/transformers : la logique testee (preparation
      # des donnees, metriques, retrieval) en est independante par conception.
      # La CI s'installe ainsi en quelques secondes, sans GPU ni reseau vers le
      # Hugging Face Hub.
      - name: Installer les dependances (logique pure uniquement)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint + imports)
        run: ruff check . --output-format=github

      - name: Tests
        run: pytest -m "not slow" --cov=src --cov-report=term-missing

  # Verifie que le pipeline de donnees complet s'execute et, surtout, que le
  # garde-fou anti-fuite passe sur le VRAI corpus. C'est le test de
  # non-regression du defaut corrige au Tier 0.
  data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generer le corpus et decouper les splits
        run: |
          python scripts/generate_dataset.py
          python prepare_dataset.py

      - name: Verifier qu'aucun split n'a ete modifie par megarde
        run: git diff --exit-code data/processed/
